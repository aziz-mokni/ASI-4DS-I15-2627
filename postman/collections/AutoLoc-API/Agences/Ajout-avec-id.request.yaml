$kind: http-request
url: "{{asiApiUrl}}/agences"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: '{"idAgence": 1, "nom": "Agence test", "ville": "Tunis", "adresse": "2 Rue X"}'
scripts:
  - type: afterResponse
    code: |-
      pm.test("Statut 400", () => {
          pm.response.to.have.status(400);
      });
    language: text/javascript
order: 5000
