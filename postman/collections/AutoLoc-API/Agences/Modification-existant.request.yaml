url: "{{asiApiUrl}}/agences/{{agenceId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: '{"nom": "Agence modifiee", "ville": "Sfax", "adresse": "3 Rue Y", "telephone": "74000000"}'
